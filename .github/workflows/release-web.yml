# Publishes @paramrig/web to the npm registry when a `web-v<version>` tag is pushed.
#
# The tag has to name the version packages/web-sdk/package.json declares, so a release is never a
# surprise about which code it carries. The job signs in with GitHub's OIDC token: the package's
# trusted publisher on npmjs.com names this repository and this file, no registry token lives in the
# repository's secrets, and npm attaches provenance on its own. The verification chain runs again
# here rather than trusting an earlier run, because a tag can be pushed to any commit.
name: release web

on:
  push:
    tags: ['web-v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: The tag names the version the package declares
        run: |
          declared="web-v$(node -p "require('./packages/web-sdk/package.json').version")"
          test "$GITHUB_REF_NAME" = "$declared" || { echo "tag $GITHUB_REF_NAME, package says $declared"; exit 1; }
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build:web-sdk
      # Trusted publishing needs npm 11.5.1 or later; the npm Node 22 ships is older.
      - run: npm install -g npm@11
      - run: npm publish
        working-directory: packages/web-sdk

  # The tag is what publishes; this only writes down what it carried, so the Releases tab reads as
  # the history of the package rather than a list of numbers. It waits for `publish` on purpose: a
  # release naming a version the registry refused would be a lie the repository tells about itself.
  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, because the notes are the commits since the previous web-v tag.
          fetch-depth: 0
      - name: The release says what changed since the previous tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#web-v}"
          page="https://www.npmjs.com/package/@paramrig/web/v/$version"
          repository="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          previous=$(git tag --list 'web-v*' --sort=-v:refname |
            awk -v tag="$GITHUB_REF_NAME" 'tag == $0 { seen = 1; next } seen { print; exit }')
          {
            printf '[`@paramrig/web@%s` on npm](%s), published from this tag with\n' "$version" "$page"
            printf 'provenance; `npm audit signatures` checks it wherever it is installed.\n'
            if [ -n "$previous" ]; then
              changes=$(git log --format='- %s' "$previous..$GITHUB_REF_NAME" \
                -- packages/web-sdk src/web)
              if [ -n "$changes" ]; then printf '\n## In the package\n\n%s\n' "$changes"; fi
              printf '\n[Everything else in the repository since %s](%s/compare/%s...%s)\n' \
                "$previous" "$repository" "$previous" "$GITHUB_REF_NAME"
            fi
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" \
            --title "@paramrig/web $version"
