# Dependency updates arrive once a month, so a single maintainer reviews one pull request rather
# than a stream. Minor and patch updates travel together; a major arrives on its own, because a
# major is rarely just a version. The first grouped run proved it: nineteen updates in one pull
# request, and the whole thing blocked by one pair that cannot agree, with eighteen fine updates
# waiting behind it. Security updates are separate and come as soon as an advisory does.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      dependencies:
        patterns: ['*']
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    # eslint-plugin-react-refresh 0.5 is a major in everything but its version number: it reports 86
    # `only-export-components` errors against code that has not changed. Held below it, so a monthly
    # group of harmless updates is not red because of one that is a refactor. Lift this with the
    # ESLint 10 and react-hooks 7 upgrade, which is the same piece of work.
    ignore:
      - dependency-name: eslint-plugin-react-refresh
        versions: ['>=0.5.0']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
        update-types: [minor, patch]
    open-pull-requests-limit: 3
