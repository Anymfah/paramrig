name: paramrig

# Unified local stack for Docker Desktop.
# Limits are ceilings, not reservations.
services:
  app:
    build:
      context: .
      dockerfile: docker/dev.Dockerfile
    command: >-
      sh -lc "npm install --package-lock=false --prefer-offline --no-audit --no-fund &&
      exec ./node_modules/.bin/vite --host 0.0.0.0 --port 5174"
    init: true
    restart: "no"
    ports:
      - "5174:5174"
    volumes:
      - ./:/workspace
      - app-node-modules:/workspace/node_modules
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5174/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 8s
      retries: 10
      start_period: 45s
    cpus: 1.0
    mem_limit: 1536m
    pids_limit: 256
    stop_grace_period: 15s

  web:
    profiles: [web]
    build:
      context: .
      dockerfile: docker/dev.Dockerfile
    command: node --experimental-strip-types services/web/server.mjs
    init: true
    restart: "no"
    # The feedback files belong to whoever runs the project, not to the image's own user. Docker
    # Desktop maps ownership for you; on Linux a bind mount keeps the container's numeric ids, so
    # export PARAMRIG_UID=$(id -u) and PARAMRIG_GID=$(id -g) there or the project's agent cannot
    # read the batches written for it. The files stay 0600 either way.
    user: "${PARAMRIG_UID:-1000}:${PARAMRIG_GID:-1000}"
    environment:
      PARAMRIG_PROJECT_DIR: /project
      PARAMRIG_SEED_MANIFEST: ${PARAMRIG_SEED_MANIFEST-/workspace/examples/web/manifest.json}
    volumes:
      - ./:/workspace:ro
      - ${PARAMRIG_PROJECT_DIR:-./.local/web}:/project
    expose:
      - "5175"
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 64

volumes:
  app-node-modules:
